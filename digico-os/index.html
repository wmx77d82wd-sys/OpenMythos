<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigiCo Quantum OS</title>
<style>
  :root { --bg1:#0b1026; --bg2:#3b1d6e; --panel:#141a33ee; --fg:#e8ecff; --accent:#7c5cff; --border:#2a3360; }
  :root[data-theme="light"] { --bg1:#dfe7ff; --bg2:#f3e8ff; --panel:#ffffffee; --fg:#14182e; --accent:#5b3df5; --border:#c5cdf0; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; font:14px system-ui,sans-serif; color:var(--fg); }
  #desktop { position:fixed; inset:0 0 44px 0; background:radial-gradient(circle at 20% 20%, var(--bg2), var(--bg1)); }
  #icons { position:absolute; top:12px; left:12px; display:grid; gap:10px; grid-template-columns:repeat(auto-fill,84px); width:60%; }
  .icon { width:84px; text-align:center; padding:8px 4px; border-radius:10px; cursor:pointer; user-select:none; }
  .icon:hover { background:#ffffff22; }
  .icon .ico { font-size:32px; }
  .icon .lbl { font-size:12px; margin-top:4px; word-break:break-word; }
  .win { position:absolute; background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:0 10px 40px #0008; display:flex; flex-direction:column; min-width:260px; min-height:160px; resize:both; overflow:hidden; backdrop-filter:blur(8px); }
  .win .bar { display:flex; align-items:center; gap:8px; padding:6px 10px; background:#ffffff14; cursor:move; user-select:none; }
  .win .bar .t { flex:1; font-weight:600; }
  .win .bar button { background:none; border:0; color:var(--fg); cursor:pointer; font-size:15px; border-radius:4px; padding:2px 7px; }
  .win .bar button:hover { background:#ffffff2a; }
  .win .body { flex:1; overflow:auto; padding:10px; }
  .win iframe { width:100%; height:100%; border:0; background:#fff; border-radius:6px; }
  .win.focus { border-color:var(--accent); }
  #taskbar { position:fixed; left:0; right:0; bottom:0; height:44px; background:var(--panel); border-top:1px solid var(--border); display:flex; align-items:center; gap:6px; padding:0 8px; backdrop-filter:blur(8px); z-index:99999; }
  #taskbar button, .btn { background:#ffffff1a; color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit; }
  #taskbar button:hover, .btn:hover { background:#ffffff33; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  #tasks { flex:1; display:flex; gap:6px; overflow:hidden; }
  #clock { padding:0 8px; opacity:.85; }
  #menu { position:fixed; bottom:48px; left:8px; width:260px; max-height:70vh; overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:8px; display:none; z-index:99998; }
  #menu .item { padding:8px 10px; border-radius:8px; cursor:pointer; display:flex; gap:10px; align-items:center; }
  #menu .item:hover { background:#ffffff22; }
  input, textarea, select { width:100%; background:#00000033; color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:8px; font:inherit; }
  textarea { font-family:ui-monospace,monospace; resize:vertical; }
  label { display:block; margin:8px 0 4px; opacity:.85; }
  .term { font-family:ui-monospace,monospace; background:#000a; color:#9dff9d; height:100%; overflow:auto; padding:8px; border-radius:6px; white-space:pre-wrap; }
  .term input { background:none; border:0; color:inherit; padding:0; width:70%; outline:none; font:inherit; }
  #qbg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #icons { z-index:1; }
  #toasts { position:fixed; right:12px; bottom:56px; display:flex; flex-direction:column; gap:8px; z-index:100000; }
  .toast { background:var(--panel); border:1px solid var(--accent); border-radius:10px; padding:10px 14px; max-width:300px; animation:in .2s; }
  @keyframes in { from { transform:translateY(10px); opacity:0; } }
  .row { display:flex; gap:8px; align-items:center; padding:5px 6px; border-radius:6px; cursor:pointer; }
  .row:hover { background:#ffffff1a; }
  .bar2 { height:14px; background:var(--accent); border-radius:4px; transition:width .25s; min-width:1px; }
  .gates { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0 8px; align-items:center; }
  .gates .btn { padding:4px 10px; }
</style>
</head>
<body>
<div id="desktop"><canvas id="qbg"></canvas><div id="icons"></div></div>
<div id="toasts"></div>
<div id="menu"></div>
<div id="taskbar">
  <button id="startBtn">⚛️ Inicio</button>
  <div id="tasks"></div>
  <span id="clock"></span>
</div>

<script>
// ---------- Estado persistente ----------
const LS = {
  get(k, d) { try { const v = localStorage.getItem('dqos.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('dqos.' + k, JSON.stringify(v)); } catch {} }
};
let customApps = LS.get('apps', []);   // {id,name,icon,type:'html'|'url',content}
let settings   = Object.assign({ theme: 'dark', bg1: '#0b1026', bg2: '#3b1d6e', qbg: true }, LS.get('settings', {}));
let notes      = LS.get('notes', '');

// Sistema de archivos virtual: mapa plano ruta -> contenido (las carpetas son prefijos)
let fs = LS.get('fs', { '/Bienvenida.txt': 'Bienvenido a DigiCo Quantum OS.\nAquí guardas tus archivos. Tus apps usan os.fs dentro de /apps/<id>/.' });
const saveFs = () => LS.set('fs', fs);
const absPath = p => p.startsWith('/') ? p : '/' + p;
function fsEntries(dir) {
  const seen = new Map();
  for (const k of Object.keys(fs)) {
    if (!k.startsWith(dir)) continue;
    const rest = k.slice(dir.length), i = rest.indexOf('/');
    if (i >= 0) seen.set(rest.slice(0, i), true);
    else if (rest !== '.keep') seen.set(rest, false);
  }
  return [...seen].map(([name, dir]) => ({ name, dir })).sort((a, b) => b.dir - a.dir || a.name.localeCompare(b.name));
}

function notify(text) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = text;
  document.getElementById('toasts').appendChild(d);
  setTimeout(() => d.remove(), 3500);
}

function applySettings() {
  const r = document.documentElement;
  r.dataset.theme = settings.theme;
  if (settings.theme === 'dark') { r.style.setProperty('--bg1', settings.bg1); r.style.setProperty('--bg2', settings.bg2); }
  else { r.style.removeProperty('--bg1'); r.style.removeProperty('--bg2'); }
}
const saveApps = () => LS.set('apps', customApps);
const saveSettings = () => { LS.set('settings', settings); applySettings(); };

// ---------- Gestor de ventanas ----------
let z = 10, winCount = 0;
const wins = new Map();

function openWindow(title, icon, render, opts = {}) {
  const id = ++winCount;
  const el = document.createElement('div');
  el.className = 'win';
  const off = (id % 8) * 28;
  Object.assign(el.style, { left: (80 + off) + 'px', top: (50 + off) + 'px', width: (opts.w || 520) + 'px', height: (opts.h || 380) + 'px' });
  el.innerHTML = `<div class="bar"><span>${icon}</span><span class="t"></span><button data-a="min">–</button><button data-a="max">▢</button><button data-a="close">✕</button></div><div class="body"></div>`;
  el.querySelector('.t').textContent = title;
  const body = el.querySelector('.body');
  document.getElementById('desktop').appendChild(el);

  const task = document.createElement('button');
  task.textContent = icon + ' ' + title;
  document.getElementById('tasks').appendChild(task);

  const w = { el, task, min: false, prev: null };
  wins.set(id, w);
  const focus = () => { el.style.zIndex = ++z; wins.forEach(o => o.el.classList.remove('focus')); el.classList.add('focus'); };
  const toggleMin = () => { w.min = !w.min; el.style.display = w.min ? 'none' : 'flex'; if (!w.min) focus(); };
  const close = () => { el.remove(); task.remove(); wins.delete(id); };

  el.addEventListener('mousedown', focus);
  task.onclick = () => (w.min || !el.classList.contains('focus')) ? (w.min && toggleMin(), focus()) : toggleMin();
  el.querySelector('[data-a=close]').onclick = close;
  el.querySelector('[data-a=min]').onclick = toggleMin;
  el.querySelector('[data-a=max]').onclick = () => {
    if (w.prev) { Object.assign(el.style, w.prev); w.prev = null; }
    else { w.prev = { left: el.style.left, top: el.style.top, width: el.style.width, height: el.style.height }; Object.assign(el.style, { left: 0, top: 0, width: '100%', height: '100%' }); }
  };

  // arrastrar
  const bar = el.querySelector('.bar');
  bar.addEventListener('mousedown', e => {
    if (e.target.tagName === 'BUTTON') return;
    const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
    const mv = ev => { el.style.left = (ev.clientX - sx) + 'px'; el.style.top = Math.max(0, ev.clientY - sy) + 'px'; };
    const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
    addEventListener('mousemove', mv); addEventListener('mouseup', up);
  });

  render(body, { close });
  focus();
  return w;
}

// ---------- Apps integradas ----------
const builtins = [
  { id: 'terminal', name: 'Terminal', icon: '⌨️', open: openTerminal },
  { id: 'files',    name: 'Archivos', icon: '📁', open: () => openFiles() },
  { id: 'qubit',    name: 'Qubit Lab', icon: '⚛️', open: openQubitLab },
  { id: 'assistant', name: 'Asistente IA', icon: '🤖', open: openAssistant },
  { id: 'cloud',    name: 'Nube',     icon: '☁️', open: openCloud },
  { id: 'notes',    name: 'Notas',    icon: '📝', open: openNotes },
  { id: 'builder',  name: 'Agregar App', icon: '➕', open: openBuilder },
  { id: 'manager',  name: 'Mis Apps', icon: '🗂️', open: openManager },
  { id: 'settings', name: 'Ajustes',  icon: '⚙️', open: openSettings },
];

function openNotes() {
  openWindow('Notas', '📝', b => {
    b.style.padding = '0';
    b.innerHTML = '<textarea style="height:100%;border:0;border-radius:0" placeholder="Escribe aquí…"></textarea>';
    const t = b.firstChild; t.value = notes;
    t.oninput = () => { notes = t.value; LS.set('notes', notes); };
  });
}

// SDK inyectado en las apps HTML: window.os.{notify, fs.read/write/list/remove}
const SDK = '<script>(()=>{let id=0;const p={};addEventListener("message",e=>{const m=e.data;if(m&&m.dqos&&p[m.id]){m.err?p[m.id].rej(new Error(m.err)):p[m.id].res(m.val);delete p[m.id]}});' +
  'const call=(m,a)=>new Promise((res,rej)=>{const i=++id;p[i]={res,rej};parent.postMessage({dqos:1,id:i,m,a},"*")});' +
  'window.os={notify:t=>call("notify",[t]),fs:{read:f=>call("read",[f]),write:(f,c)=>call("write",[f,c]),list:()=>call("list",[]),remove:f=>call("remove",[f])}};})()<\/script>';
const frames = new WeakMap();   // contentWindow -> app

addEventListener('message', e => {
  const m = e.data, app = m && m.dqos && frames.get(e.source);
  if (!app) return;
  const root = '/apps/' + app.id + '/';
  const path = f => root + String(f).replace(/^\/+/, '').replace(/\.\.+/g, '');
  const ops = {
    notify: t => { notify(app.name + ': ' + t); },
    read: f => fs[path(f)] ?? null,
    write: (f, c) => { fs[path(f)] = String(c); saveFs(); },
    list: () => Object.keys(fs).filter(k => k.startsWith(root)).map(k => k.slice(root.length)),
    remove: f => { delete fs[path(f)]; saveFs(); },
  };
  let reply;
  try { reply = { dqos: 1, id: m.id, val: ops[m.m] ? ops[m.m](...m.a) : undefined }; }
  catch (err) { reply = { dqos: 1, id: m.id, err: String(err) }; }
  e.source.postMessage(reply, '*');
});

function openCustom(app) {
  openWindow(app.name, app.icon, b => {
    b.style.padding = '0';
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-popups');
    if (app.type === 'url') f.src = app.content; else f.srcdoc = SDK + app.content;
    b.appendChild(f);
    frames.set(f.contentWindow, app);
  }, { w: 640, h: 440 });
}

const TEMPLATES = {
  'Vacía': '',
  'Calculadora': ['<input id="e" placeholder="2+2*3" style="width:70%;font-size:20px">',
    '<button onclick="r.textContent=eval(e.value.replace(/[^-+*/().0-9 ]/g,\'\'))">=</button><h2 id="r"></h2>'].join('\n'),
  'Tareas (guarda en archivos)': ['<h3>Tareas</h3><input id="t"><button onclick="add()">+</button><ul id="l"></ul>',
    '<script>let T=[];const draw=()=>l.innerHTML=T.map((x,i)=>"<li onclick=\'T.splice("+i+",1);save()\'>"+x.replace(/</g,"&lt;")+"</li>").join("");',
    'const save=async()=>{await os.fs.write("tareas.json",JSON.stringify(T));draw()};',
    'const add=()=>{if(t.value){T.push(t.value);t.value="";save();os.notify("Tarea agregada")}};',
    'os.fs.read("tareas.json").then(v=>{T=v?JSON.parse(v):[];draw()});<\/script>'].join('\n'),
  'Reloj': '<h1 id="c" style="font-size:48px;text-align:center"></h1><script>setInterval(()=>c.textContent=new Date().toLocaleTimeString(),500)<\/script>',
};

function openFiles(startDir) {
  let dir = startDir || '/';
  openWindow('Archivos', '📁', b => {
    const draw = () => {
      b.innerHTML = '';
      const top = document.createElement('div');
      top.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:8px';
      top.innerHTML = '<button class="btn" data-up>⬆️</button><b style="flex:1"></b><button class="btn" data-nf>+ Archivo</button><button class="btn" data-nd>+ Carpeta</button>';
      top.querySelector('b').textContent = dir;
      top.querySelector('[data-up]').onclick = () => { dir = dir.replace(/[^/]+\/$/, '') || '/'; draw(); };
      top.querySelector('[data-nf]').onclick = () => { const n = prompt('Nombre del archivo'); if (n) { fs[dir + n] = ''; saveFs(); openEditor(dir + n); draw(); } };
      top.querySelector('[data-nd]').onclick = () => { const n = prompt('Nombre de la carpeta'); if (n) { fs[dir + n + '/.keep'] = ''; saveFs(); draw(); } };
      b.appendChild(top);
      const es = fsEntries(dir);
      if (!es.length) b.insertAdjacentHTML('beforeend', '<p>Carpeta vacía</p>');
      es.forEach(en => {
        const row = document.createElement('div'); row.className = 'row';
        row.innerHTML = '<span style="flex:1"></span><button class="btn">🗑️</button>';
        row.firstChild.textContent = (en.dir ? '📁 ' : '📄 ') + en.name;
        row.onclick = () => en.dir ? (dir += en.name + '/', draw()) : openEditor(dir + en.name);
        row.querySelector('button').onclick = ev => {
          ev.stopPropagation();
          if (!confirm('¿Borrar ' + en.name + '?')) return;
          const p = dir + en.name;
          Object.keys(fs).filter(k => k === p || k.startsWith(p + '/')).forEach(k => delete fs[k]);
          saveFs(); draw();
        };
        b.appendChild(row);
      });
    };
    draw();
  }, { w: 480, h: 380 });
}

function openEditor(path) {
  openWindow(path.split('/').pop(), '📄', b => {
    b.innerHTML = '<textarea style="height:calc(100% - 48px)"></textarea><p style="margin:8px 0 0"><button class="btn primary">Guardar</button></p>';
    const t = b.querySelector('textarea'); t.value = fs[path] || '';
    b.querySelector('button').onclick = () => { fs[path] = t.value; saveFs(); notify('Guardado ' + path); };
  }, { w: 480, h: 360 });
}

// Copia completa del estado para exportar / sincronizar (sin claves de API)
const snapshot = () => ({ apps: customApps, settings, notes, fs });
function applySnapshot(d) {
  customApps = d.apps || []; settings = Object.assign(settings, d.settings || {}); notes = d.notes || ''; fs = d.fs || fs;
  saveApps(); saveSettings(); saveFs(); LS.set('notes', notes); refresh(); startBg();
}

// Simulador de hasta 5 qubits con circuito editable (arrastra puertas a la rejilla).
// Una columna con ● (control) y puertas aplica esas puertas controladas: CNOT, Toffoli, etc.
function openQubitLab() {
  openWindow('Qubit Lab', '⚛️', b => {
    const R = Math.SQRT1_2, MAXQ = 5;
    const G = {
      H: [[[R, 0], [R, 0]], [[R, 0], [-R, 0]]],
      X: [[[0, 0], [1, 0]], [[1, 0], [0, 0]]],
      Y: [[[0, 0], [0, -1]], [[0, 1], [0, 0]]],
      Z: [[[1, 0], [0, 0]], [[0, 0], [-1, 0]]],
      S: [[[1, 0], [0, 0]], [[0, 0], [0, 1]]],
      T: [[[1, 0], [0, 0]], [[0, 0], [R, R]]],
    };
    const PAL = [...Object.keys(G), 'C'];
    const newCol = () => Array(MAXQ).fill(null);
    let n = 3, cols = Array.from({ length: 6 }, newCol), sel = null, shots = null;

    const probs = () => {
      const N = 1 << n; let re = new Float64Array(N), im = new Float64Array(N); re[0] = 1;
      for (const col of cols) {
        let cm = 0;
        for (let q = 0; q < n; q++) if (col[q] === 'C') cm |= 1 << q;
        for (let k = 0; k < n; k++) {
          const g = G[col[k]]; if (!g) continue;
          const [[g00, g01], [g10, g11]] = g, nr = re.slice(), ni = im.slice();
          for (let i = 0; i < N; i++) {
            if (((i >> k) & 1) || (i & cm) !== cm) continue;
            const j = i | (1 << k), ar = re[i], ai = im[i], cr = re[j], ci = im[j];
            nr[i] = g00[0] * ar - g00[1] * ai + g01[0] * cr - g01[1] * ci;
            ni[i] = g00[0] * ai + g00[1] * ar + g01[0] * ci + g01[1] * cr;
            nr[j] = g10[0] * ar - g10[1] * ai + g11[0] * cr - g11[1] * ci;
            ni[j] = g10[0] * ai + g10[1] * ar + g11[0] * ci + g11[1] * cr;
          }
          re = nr; im = ni;
        }
      }
      return Array.from(re, (r, i) => r * r + im[i] * im[i]);
    };
    const label = i => '|' + i.toString(2).padStart(n, '0') + '⟩';
    const place = (c, q, g) => { cols[c][q] = g || null; shots = null; draw(); };
    const preset = (nq, cells) => { n = nq; cols = Array.from({ length: 6 }, newCol); cells.forEach(([c, q, g]) => cols[c][q] = g); shots = null; draw(); };

    const draw = () => {
      const p = probs();
      let h = '<div class="gates"><b>Qubits</b><select id="nq" style="width:auto">' + [2, 3, 4, 5].map(k => '<option' + (k === n ? ' selected' : '') + '>' + k + '</option>').join('') + '</select>' +
        '<b style="margin-left:8px">Puertas</b>' +
        PAL.map(g => '<button class="btn' + (sel === g ? ' primary' : '') + '" draggable="true" data-p="' + g + '">' + (g === 'C' ? '●' : g) + '</button>').join('') +
        '</div><div class="gates"><button class="btn" data-pre="bell">Bell</button><button class="btn" data-pre="ghz">GHZ</button><button class="btn" data-pre="tof">Toffoli</button>' +
        '<button class="btn" data-addc>+ columna</button><button class="btn" data-clear>Limpiar</button><button class="btn primary" data-s>×1000</button></div>' +
        '<table style="border-collapse:collapse;margin-bottom:8px">';
      for (let q = 0; q < n; q++) {
        h += '<tr><td style="padding-right:6px"><code>q' + q + '</code></td>';
        cols.forEach((col, c) => { h += '<td class="qc" data-c="' + c + '" data-q="' + q + '">' + (col[q] === 'C' ? '●' : col[q] || '') + '</td>'; });
        h += '</tr>';
      }
      h += '</table>';
      const total = shots ? shots.reduce((a, c) => a + c, 0) : 0;
      p.forEach((v, i) => {
        if (v < 5e-4 && !(shots && shots[i])) return;
        const w = shots ? shots[i] / total : v;
        h += '<div style="display:flex;gap:8px;align-items:center;margin:2px 0"><code style="width:64px">' + label(i) + '</code><div style="flex:1"><div class="bar2" style="width:' + (w * 100) + '%"></div></div><span style="width:90px;text-align:right">' + (v * 100).toFixed(1) + '%' + (shots ? ' · ' + shots[i] : '') + '</span></div>';
      });
      b.innerHTML = '<style>.qc{width:38px;height:32px;text-align:center;border:1px dashed var(--border);cursor:pointer;background:linear-gradient(var(--border),var(--border)) center/100% 1px no-repeat}.qc:hover{background-color:#ffffff22}</style>' + h;
      b.querySelector('#nq').onchange = e => { n = +e.target.value; shots = null; draw(); };
      b.querySelectorAll('[data-p]').forEach(x => {
        x.onclick = () => { sel = sel === x.dataset.p ? null : x.dataset.p; draw(); };
        x.ondragstart = e => e.dataTransfer.setData('text/plain', x.dataset.p);
      });
      b.querySelectorAll('.qc').forEach(x => {
        x.ondragover = e => e.preventDefault();
        x.ondrop = e => { e.preventDefault(); place(+x.dataset.c, +x.dataset.q, e.dataTransfer.getData('text/plain')); };
        x.onclick = () => place(+x.dataset.c, +x.dataset.q, sel);
      });
      b.querySelectorAll('[data-pre]').forEach(x => x.onclick = () => ({
        bell: () => preset(2, [[0, 0, 'H'], [1, 0, 'C'], [1, 1, 'X']]),
        ghz: () => preset(3, [[0, 0, 'H'], [1, 0, 'C'], [1, 1, 'X'], [2, 1, 'C'], [2, 2, 'X']]),
        tof: () => preset(3, [[0, 0, 'X'], [0, 1, 'X'], [1, 0, 'C'], [1, 1, 'C'], [1, 2, 'X']]),
      })[x.dataset.pre]());
      b.querySelector('[data-addc]').onclick = () => { cols.push(newCol()); draw(); };
      b.querySelector('[data-clear]').onclick = () => { cols = Array.from({ length: 6 }, newCol); shots = null; draw(); };
      b.querySelector('[data-s]').onclick = () => {
        shots = new Array(p.length).fill(0);
        for (let k = 0; k < 1000; k++) { let r = Math.random(), i = 0; while (i < p.length - 1 && r >= p[i]) r -= p[i++]; shots[i]++; }
        draw();
      };
    };
    draw();
  }, { w: 560, h: 520 });
}

// Asistente: pide a Claude que escriba una app y la instala. La clave se guarda solo en este navegador.
const AI_SYSTEM = 'Eres el generador de apps de DigiCo Quantum OS. Responde SOLO con un objeto JSON: {"name": string, "icon": un emoji, "html": string}. ' +
  '"html" es un documento HTML completo y autocontenido (CSS y JS en línea, sin librerías externas). Corre en un iframe aislado. ' +
  'Puede usar window.os: os.notify(texto), os.fs.read(ruta), os.fs.write(ruta, texto), os.fs.list(), os.fs.remove(ruta); todas devuelven promesas y guardan datos persistentes.';

function openAssistant() {
  openWindow('Asistente IA', '🤖', b => {
    b.innerHTML = '<label>API key de Anthropic (se guarda solo en este navegador)</label><input type="password" data-k placeholder="sk-ant-...">' +
      '<label>¿Qué app quieres?</label><textarea rows="4" data-p placeholder="Un cronómetro con vueltas que guarde el historial"></textarea>' +
      '<p><button class="btn primary" data-go>Generar e instalar</button></p><pre data-o style="white-space:pre-wrap;opacity:.85"></pre>';
    const key = b.querySelector('[data-k]'), prompt_ = b.querySelector('[data-p]'), out = b.querySelector('[data-o]'), go = b.querySelector('[data-go]');
    key.value = LS.get('ak', '');
    go.onclick = async () => {
      if (!key.value.trim() || !prompt_.value.trim()) return alert('Falta la clave o la descripción');
      LS.set('ak', key.value.trim());
      go.disabled = true; out.textContent = 'Generando…';
      try {
        const r = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-api-key': key.value.trim(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
          body: JSON.stringify({ model: 'claude-sonnet-5-5', max_tokens: 8000, system: AI_SYSTEM, messages: [{ role: 'user', content: prompt_.value }] }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
        const txt = j.content.map(c => c.text || '').join('');
        const a = JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
        if (typeof a.name !== 'string' || typeof a.html !== 'string') throw new Error('Respuesta sin name/html');
        const app = { id: 'app' + Date.now(), name: a.name, icon: a.icon || '🤖', type: 'html', content: a.html };
        customApps.push(app); saveApps(); refresh();
        out.textContent = 'Instalada: ' + app.icon + ' ' + app.name; notify('App instalada: ' + app.name); openCustom(app);
      } catch (err) { out.textContent = 'Error: ' + err.message; }
      go.disabled = false;
    };
  }, { w: 480, h: 440 });
}

// Sincronización con Supabase (Auth + PostgREST). Tabla y políticas RLS en sync.sql.
let sbSession = null;   // { token, uid } solo en memoria
function openCloud() {
  openWindow('Nube', '☁️', b => {
    const cfg = LS.get('cloud', { url: '', key: '', email: '' });
    b.innerHTML = '<label>URL del proyecto Supabase</label><input data-u placeholder="https://xxxx.supabase.co">' +
      '<label>Anon key</label><input data-k><label>Correo</label><input data-e type="email"><label>Contraseña</label><input data-w type="password">' +
      '<p style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-su>Crear cuenta</button><button class="btn" data-in>Entrar</button>' +
      '<button class="btn primary" data-up>⬆️ Subir</button><button class="btn" data-down>⬇️ Descargar</button></p><div data-s style="opacity:.85"></div>';
    const $ = s => b.querySelector(s), st = $('[data-s]');
    $('[data-u]').value = cfg.url; $('[data-k]').value = cfg.key; $('[data-e]').value = cfg.email;
    const conf = () => {
      const c = { url: $('[data-u]').value.trim().replace(/\/$/, ''), key: $('[data-k]').value.trim(), email: $('[data-e]').value.trim() };
      LS.set('cloud', c); return c;
    };
    const say = s => { st.textContent = s; };
    const guard = fn => async () => { try { await fn(); } catch (e) { say('Error: ' + e.message); } };
    const auth = kind => async () => {
      const c = conf();
      const r = await fetch(c.url + (kind === 'signup' ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password'), {
        method: 'POST', headers: { apikey: c.key, 'content-type': 'application/json' },
        body: JSON.stringify({ email: c.email, password: $('[data-w]').value }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.msg || j.error_description || j.message || r.status);
      if (!j.access_token) throw new Error('Confirma tu correo y luego pulsa Entrar');
      sbSession = { token: j.access_token, uid: j.user.id }; say('Sesión iniciada ✔');
    };
    const rest = (path, opts = {}) => {
      if (!sbSession) throw new Error('Primero entra a tu cuenta');
      const c = conf();
      return fetch(c.url + '/rest/v1/dqos_state' + path, { ...opts, headers: { apikey: c.key, Authorization: 'Bearer ' + sbSession.token, 'content-type': 'application/json', ...opts.headers } });
    };
    $('[data-su]').onclick = guard(auth('signup'));
    $('[data-in]').onclick = guard(auth('login'));
    $('[data-up]').onclick = guard(async () => {
      const r = await rest('?on_conflict=user_id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates' }, body: JSON.stringify([{ user_id: sbSession && sbSession.uid, data: snapshot(), updated_at: new Date().toISOString() }]) });
      if (!r.ok) throw new Error((await r.json()).message || r.status);
      say('Subido ✔ ' + new Date().toLocaleTimeString()); notify('Sincronizado con la nube');
    });
    $('[data-down]').onclick = guard(async () => {
      const r = await rest('?select=data,updated_at&user_id=eq.' + (sbSession && sbSession.uid));
      const rows = await r.json();
      if (!r.ok) throw new Error(rows.message || r.status);
      if (!rows.length) throw new Error('No hay copia en la nube todavía');
      if (!confirm('Esto reemplaza tus apps y archivos locales con la copia del ' + new Date(rows[0].updated_at).toLocaleString() + '. ¿Seguir?')) return;
      applySnapshot(rows[0].data); say('Descargado ✔');
    });
  }, { w: 440, h: 460 });
}

function openBuilder(editId) {
  const editing = typeof editId === 'string' ? customApps.find(a => a.id === editId) : null;
  openWindow(editing ? 'Editar App' : 'Agregar App', '➕', (b, { close }) => {
    b.innerHTML = `
      <label>Nombre</label><input id="n" placeholder="Mi app">
      <label>Ícono (emoji)</label><input id="i" value="🧩" maxlength="4">
      <label>Tipo</label><select id="t"><option value="html">Código HTML/JS (lo escribes aquí)</option><option value="url">URL externa</option></select>
      <label>Plantilla</label><select id="tp">${Object.keys(TEMPLATES).map(k => `<option>${k}</option>`).join('')}</select>
      <label>Contenido (código o URL)</label><textarea id="c" rows="10" placeholder="<h1>Hola</h1>&lt;script&gt;…&lt;/script&gt;"></textarea>
      <p><button class="btn primary" id="ok">${editing ? 'Guardar' : 'Instalar'}</button></p>`;
    if (editing) { n.value = editing.name; i.value = editing.icon; t.value = editing.type; c.value = editing.content; }
    tp.onchange = () => { c.value = TEMPLATES[tp.value]; t.value = 'html'; };
    ok.onclick = () => {
      if (!n.value.trim() || !c.value.trim()) return alert('Falta nombre o contenido');
      const data = { name: n.value.trim(), icon: i.value || '🧩', type: t.value, content: c.value };
      if (editing) Object.assign(editing, data); else customApps.push({ id: 'app' + Date.now(), ...data });
      saveApps(); refresh(); close();
    };
  }, { w: 480, h: 520 });
}

function openManager() {
  openWindow('Mis Apps', '🗂️', b => {
    const draw = () => {
      b.innerHTML = customApps.length ? '' : '<p>No has instalado apps todavía. Usa ➕ Agregar App.</p>';
      customApps.forEach(a => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:6px';
        row.innerHTML = `<span style="flex:1">${a.icon} <b></b></span><button class="btn" data-e>Editar</button><button class="btn" data-d>Borrar</button>`;
        row.querySelector('b').textContent = a.name;
        row.querySelector('[data-e]').onclick = () => openBuilder(a.id);
        row.querySelector('[data-d]').onclick = () => { customApps = customApps.filter(x => x !== a); saveApps(); refresh(); draw(); };
        b.appendChild(row);
      });
    };
    draw();
  });
}

function openSettings() {
  openWindow('Ajustes', '⚙️', b => {
    b.innerHTML = `
      <label>Tema</label><select id="th"><option value="dark">Oscuro</option><option value="light">Claro</option></select>
      <label><input id="qb" type="checkbox" style="width:auto"> Fondo cuántico animado</label>
      <label>Fondo (color 1)</label><input id="c1" type="color">
      <label>Fondo (color 2)</label><input id="c2" type="color">
      <p><button class="btn" id="exp">Exportar todo (JSON)</button> <button class="btn" id="imp">Importar</button> <button class="btn" id="rst">Restablecer</button></p>`;
    th.value = settings.theme; c1.value = settings.bg1; c2.value = settings.bg2; qb.checked = settings.qbg !== false;
    qb.onchange = () => { settings.qbg = qb.checked; saveSettings(); startBg(); };
    th.onchange = () => { settings.theme = th.value; saveSettings(); };
    c1.oninput = () => { settings.bg1 = c1.value; saveSettings(); };
    c2.oninput = () => { settings.bg2 = c2.value; saveSettings(); };
    exp.onclick = () => {
      const blob = new Blob([JSON.stringify(snapshot(), null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'digico-os-backup.json'; a.click();
    };
    imp.onclick = () => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = async () => {
        try {
          const d = JSON.parse(await inp.files[0].text());
          applySnapshot(d);
        } catch { alert('Archivo inválido'); }
      };
      inp.click();
    };
    rst.onclick = () => { if (confirm('¿Borrar todo?')) { Object.keys(localStorage).filter(k => k.startsWith('dqos.')).forEach(k => localStorage.removeItem(k)); location.reload(); } };
  }, { w: 420, h: 400 });
}

function openTerminal() {
  openWindow('Terminal', '⌨️', b => {
    b.style.padding = '0';
    b.innerHTML = '<div class="term"><div id="out">DigiCo Quantum OS — escribe "help"\n</div>$ <input id="in" autofocus></div>';
    const term = b.firstChild, out = b.querySelector('#out'), inp = b.querySelector('#in');
    const print = s => { out.textContent += s + '\n'; term.scrollTop = term.scrollHeight; };
    const all = () => [...builtins, ...customApps];
    const find = n => all().find(a => a.id === n || a.name.toLowerCase() === n.toLowerCase());
    const cmds = {
      help: () => print('help | apps | open <app> | install <nombre> <url> | remove <app> | theme dark|light\nls [dir] | cat <f> | write <f> <txt> | rm <f> | notify <txt> | date | clear | echo <txt>\n(escritorio) host ls|cat|write|rm <ruta> | sh <comando>'),
      ls: a => { let d = absPath(a[0] || '/'); if (!d.endsWith('/')) d += '/'; const es = fsEntries(d); print(es.length ? es.map(e => (e.dir ? '📁 ' : '📄 ') + e.name).join('\n') : '(vacío)'); },
      cat: a => print(fs[absPath(a[0] || '')] ?? 'No existe'),
      write: a => { fs[absPath(a[0] || '')] = a.slice(1).join(' '); saveFs(); },
      rm: a => { const p = absPath(a[0] || ''); print(p in fs ? (delete fs[p], saveFs(), 'Borrado') : 'No existe'); },
      notify: a => notify(a.join(' ')),
      // Solo en la app de escritorio (Electron): archivos reales en ~/DigiCoOS y comandos del sistema
      host: async a => {
        const h = window.hostBridge;
        if (!h) return print('Disponible solo en la app de escritorio (ver desktop/README)');
        const [c, f = '.', ...rest] = a;
        try {
          if (c === 'ls') print((await h.list(f)).join('\n') || '(vacío)');
          else if (c === 'cat') print(await h.read(f));
          else if (c === 'write') { await h.write(f, rest.join(' ')); print('Escrito'); }
          else if (c === 'rm') { await h.remove(f); print('Borrado'); }
          else print('uso: host ls|cat|write|rm <ruta> [texto]');
        } catch (e) { print('Error: ' + e.message); }
      },
      sh: async a => {
        if (!window.hostBridge) return print('Disponible solo en la app de escritorio');
        const r = await window.hostBridge.exec(a.join(' '));
        print((r.stdout || '') + (r.stderr || '') + (r.code ? '[código ' + r.code + ']' : ''));
      },
      apps: () => print(all().map(a => a.icon + ' ' + a.name).join('\n')),
      open: a => { const x = find(a.join(' ')); x ? (x.open ? x.open() : openCustom(x)) : print('No existe: ' + a.join(' ')); },
      install: a => { if (a.length < 2) return print('uso: install <nombre> <url>'); customApps.push({ id: 'app' + Date.now(), name: a[0], icon: '🌐', type: 'url', content: a[1] }); saveApps(); refresh(); print('Instalada ' + a[0]); },
      remove: a => { const n = customApps.length; customApps = customApps.filter(x => x.name.toLowerCase() !== a.join(' ').toLowerCase()); saveApps(); refresh(); print(n === customApps.length ? 'No encontrada' : 'Eliminada'); },
      theme: a => { settings.theme = a[0] === 'light' ? 'light' : 'dark'; saveSettings(); },
      date: () => print(new Date().toString()),
      clear: () => { out.textContent = ''; },
      echo: a => print(a.join(' ')),
    };
    inp.onkeydown = e => {
      if (e.key !== 'Enter') return;
      const line = inp.value.trim(); inp.value = ''; print('$ ' + line);
      if (!line) return;
      const [c, ...a] = line.split(/\s+/);
      (cmds[c] || (() => print('Comando desconocido: ' + c)))(a);
    };
    term.onclick = () => inp.focus();
  });
}


// ---------- Escritorio y menú ----------
function refresh() {
  const icons = document.getElementById('icons'), menu = document.getElementById('menu');
  icons.innerHTML = ''; menu.innerHTML = '';
  [...builtins, ...customApps].forEach(a => {
    const launch = () => { menu.style.display = 'none'; a.open ? a.open() : openCustom(a); };
    const ic = document.createElement('div'); ic.className = 'icon';
    ic.innerHTML = `<div class="ico">${a.icon}</div><div class="lbl"></div>`; ic.querySelector('.lbl').textContent = a.name;
    ic.ondblclick = launch; ic.onclick = e => { if (matchMedia('(pointer:coarse)').matches) launch(); };
    icons.appendChild(ic);
    const it = document.createElement('div'); it.className = 'item'; it.textContent = a.icon + '  ' + a.name; it.onclick = launch;
    menu.appendChild(it);
  });
}
document.getElementById('startBtn').onclick = e => { e.stopPropagation(); const m = document.getElementById('menu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; };
document.addEventListener('click', e => { if (!e.target.closest('#menu')) document.getElementById('menu').style.display = 'none'; });
setInterval(() => document.getElementById('clock').textContent = new Date().toLocaleTimeString(), 1000);

// ---------- Fondo cuántico: red de partículas ----------
const bg = document.getElementById('qbg'), bgx = bg.getContext('2d');
const pts = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random(), vx: (Math.random() - .5) * 3e-4, vy: (Math.random() - .5) * 3e-4 }));
let bgRaf = 0;
function fitBg() { bg.width = bg.clientWidth; bg.height = bg.clientHeight; }
function startBg() {
  cancelAnimationFrame(bgRaf);
  if (settings.qbg === false) { bg.style.display = 'none'; return; }
  bg.style.display = 'block'; fitBg();
  const tick = () => {
    const W = bg.width, H = bg.height;
    bgx.clearRect(0, 0, W, H);
    pts.forEach(p => { p.x = (p.x + p.vx + 1) % 1; p.y = (p.y + p.vy + 1) % 1; });
    pts.forEach((p, i) => {
      bgx.fillStyle = 'rgba(160,140,255,.8)'; bgx.beginPath(); bgx.arc(p.x * W, p.y * H, 2, 0, 7); bgx.fill();
      for (let j = i + 1; j < pts.length; j++) {
        const d = Math.hypot((p.x - pts[j].x) * W, (p.y - pts[j].y) * H);
        if (d < 120) { bgx.strokeStyle = 'rgba(124,92,255,' + (1 - d / 120) * .5 + ')'; bgx.beginPath(); bgx.moveTo(p.x * W, p.y * H); bgx.lineTo(pts[j].x * W, pts[j].y * H); bgx.stroke(); }
      }
    });
    bgRaf = requestAnimationFrame(tick);
  };
  tick();
}
addEventListener('resize', fitBg);

applySettings(); refresh(); startBg();
</script>
