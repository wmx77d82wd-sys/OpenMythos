<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigiCo Quantum OS</title>
<meta name="theme-color" content="#0b1026">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="desktop"><canvas id="qbg"></canvas><div id="icons"></div><div id="snap"></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="menu"></div>
<div id="ctx"></div>
<div id="palette"><div class="box"><input placeholder="Busca apps, archivos o acciones…  (Ctrl/⌘ + K)" aria-label="Paleta de comandos"><div class="res"></div></div></div>
<div id="taskbar">
  <button id="startBtn">⚛️ Inicio</button>
  <button id="palBtn" aria-label="Buscar" title="Buscar (Ctrl/⌘ + K)">🔍</button>
  <div id="tasks"></div>
  <span id="clock"></span>
</div>
<noscript>DigiCo Quantum OS necesita JavaScript.</noscript>
<script src="js/core.js"></script>
<script src="js/qubit.js"></script>
<script src="js/services.js"></script>
<script src="js/apps.js"></script>
<script src="js/main.js"></script>
</body>
</html>
