[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-trading"
version = "0.1.0"
description = "Paper-trading crypto MCP server: connect an AI agent so it can analyze markets and trade — safely, with simulated money only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentic-trading = "trading_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["trading_mcp"]
